<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExploreMath — Math · Physics · Robotics</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<!-- ... keep your styles here ... -->
  <style>
    /* ... your original styles here ... */
    /* Add styles for the AI button and auth overlay */
    #firebaseAuthModal {
      display: none; position:fixed;z-index:12000;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,0.82);backdrop-filter: blur(8px);
    }
    .fauth-modal {background:#181c25;padding:2.5rem 1.8rem 2rem 1.8rem;border-radius:22px;box-shadow:0 8px 48px #0a0a0c80;width:98vw;max-width:355px;position:relative}
    .fauth-modal h2 {font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:900;text-align:center;margin-bottom:.8rem}
    .fauth-btn {display:flex;align-items:center;justify-content:center;gap:.6rem;background:#fff;color:#252525;font-weight:700;box-shadow:0 2px 12px rgba(100,50,250,.16);border-radius:9px;padding:.8rem 0;font-size:1.08rem;border:none;width:100%;margin-bottom:1.1rem;cursor:pointer;transition:.18s}
    .fauth-btn:hover {background:#edf5fd}
    .fauth-or {color:#68768a;text-align:center;font-size:.92rem;margin:.7rem 0 .2rem;position:relative}
    .fauth-or:before,.fauth-or:after{content:'';position:absolute;top:50%;width:38%;height:1px;background:#272d36;}
    .fauth-or:before{left:0;}
    .fauth-or:after{right:0;}
    .fauth-fields {margin-bottom:1.4rem}
    .fauth-fields input {width:100%;margin-top:0.55rem;padding:0.67rem 0.95rem;border-radius:8px;border:1.5px solid #353a45;background:#171a22;color:#eaeaea;font-size:1rem;margin-bottom:.87rem}
    .fauth-fields label {font-size:.85rem;font-family:'Syne',sans-serif;font-weight:700;text-transform:uppercase;color:#adbff0;letter-spacing:.08em;}
    .fauth-error {color:#fd5666;text-align:center;margin-bottom:.8rem;font-size:.98rem;font-weight:700;min-height:22px;}
    .fauth-mini {text-align:center;font-size:.93rem;margin-bottom:0}.ai-fab-btn {position:fixed;bottom:1.6rem;right:1.6rem;z-index:10010;padding:.9rem 1.6rem;background:linear-gradient(120deg,#7c6dfa,#3dd6f5);color:#fff;font-family:'Syne',sans-serif;font-weight:900;font-size:1.11rem;border-radius:25px;box-shadow:0 4px 24px rgba(85,75,250,.34);border:none;display:flex;align-items:center;gap:.65rem;cursor:pointer;transition:transform .18s}
    .ai-fab-btn:hover {transform:scale(1.07);background:linear-gradient(120deg,#3dd6f5,#7c6dfa)}
  </style>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>
  <!-- Firebase Auth Modal Overlay -->
  <div id="firebaseAuthModal">
    <div class="fauth-modal">
      <h2>🔐 Sign in to ExploreMath</h2>
      <div class="fauth-mini">Your learning experience is secure & private.</div>
      <button class="fauth-btn" onclick="googleSignIn()"> <img src='https://upload.wikimedia.org/wikipedia/commons/4/4a/Logo_2013_Google.png' style='width:21px;height:21px;border-radius:50%;'> Sign in with Google </button>
      <div class="fauth-or">or</div>
      <div class="fauth-fields">
        <label for="firebase-email">Email</label>
        <input id="firebase-email" type="email" placeholder="Enter your email">
        <label for="firebase-pass">Password</label>
        <input id="firebase-pass" type="password" placeholder="Password">
      </div>
      <div style="display:flex;gap:7px;justify-content:space-between;margin-bottom:.7rem">
        <button class="fauth-btn" style="background:#7c6dfa;color:#fff;flex:1;padding:.65rem 0;font-size:.97rem" onclick="doEmailLogin()">Login</button>
        <button class="fauth-btn" style="background:#1c2436;color:#f0f7fd;flex:1;padding:.65rem 0;font-size:.97rem;border:1px solid #292d33" onclick="doRegister()">Register</button>
      </div>
      <div class="fauth-error" id="firebaseAuthError"></div>
    </div>
  </div>

  <!-- Ask AI Floating Button -->
  <button class="ai-fab-btn" onclick="window.openAIWidget && window.openAIWidget()">💬 Ask AI</button>

  <!-- BEGIN: All your existing HTML remains below -->
  <!-- ...The content you provided stays unchanged here... -->

  <!-- BEGIN: Scripts -->
  <script src="js/firebase-auth.js"></script>
  <!-- ChatGPT Assistant AI Widget -->
  <script>
    window.ChatGPTConfig = {
      title: 'ExploreMath AI Tutor',
      welcomeMessage: 'Hi! I am your ExploreMath AI. Ask me anything about math, science, or this platform!',
    };
    window.openAIWidget = function () {
      // Open the ChatGPT widget if loaded
      const existing = document.querySelector('#chatgpt-widget');
      if (existing) existing.click();
      else if (window.ChatGPTWidget) window.ChatGPTWidget.show();
      else {
        alert('AI widget is not loaded yet. Wait a moment and try again.');
      }
    }
  </script>
  <script src="https://chat.openai.com/widgets/chatgpt-widget.js" defer></script>
  <!-- Your usual scripts can continue below -->
  <!-- ...Other scripts (Google Sheets code, app logic, etc.)... -->
  
</body>
</html>
