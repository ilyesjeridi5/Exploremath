<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exploremath - Gateway Login</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #74ebe7 0%, #28a745 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .auth-container {
        width: 100%;
        max-width: 400px;
        padding: 30px;
        border-radius: 12px;
        background-color: #fff;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        box-sizing: border-box;
      }
      .auth-container h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
      }
      .auth-container label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #555;
      }
      .auth-container input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 16px;
      }
      .auth-buttons {
        display: flex;
        gap: 12px;
      }
      .auth-buttons button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: background 0.2s;
      }
      #signInButton {
        background-color: #28a745;
        color: white;
      }
      #signInButton:hover {
        background-color: #218838;
      }
      #signUpButton {
        background-color: #007bff;
        color: white;
      }
      #signUpButton:hover {
        background-color: #0069d9;
      }

      #message {
        margin-bottom: 15px;
        padding: 10px;
        border-radius: 5px;
        display: none;
        text-align: center;
        font-size: 14px;
      }
      .error {
        display: block !important;
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .success {
        display: block !important;
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <h2>Welcome to Exploremath</h2>
      <div id="message"></div>

      <form id="authForm" onsubmit="return false;">
        <label for="email">Email:</label>
        <input type="email" id="email" required placeholder="your@email.com" />

        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          required
          placeholder="Min 6 characters"
        />

        <div class="auth-buttons">
          <button type="button" id="signInButton">Sign In</button>
          <button type="button" id="signUpButton">Sign Up</button>
        </div>
      </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyBVdI7OjdSwiSN3C47sanSmj0BeX5acBKc",
        authDomain: "chemphys3d.firebaseapp.com",
        projectId: "chemphys3d",
        storageBucket: "chemphys3d.firebasestorage.app",
        messagingSenderId: "242382321033",
        appId: "1:242382321033:web:a2b9401f354fe1c052dd58",
        measurementId: "G-FDERFP24KP",
      };

      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();

      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const messageDiv = document.getElementById("message");

      function displayMessage(msg, isError = false) {
        if (!msg) {
          messageDiv.style.display = "none";
          return;
        }
        messageDiv.textContent = msg;
        messageDiv.className = isError ? "error" : "success";
      }

      // Sign Up
      document.getElementById("signUpButton").addEventListener("click", () => {
        auth
          .createUserWithEmailAndPassword(emailInput.value, passwordInput.value)
          .catch((err) => displayMessage(err.message, true));
      });

      // Sign In
      document.getElementById("signInButton").addEventListener("click", () => {
        auth
          .signInWithEmailAndPassword(emailInput.value, passwordInput.value)
          .catch((err) => displayMessage(err.message, true));
      });

      // Main Security Listener: If logged in, push to the math page
      auth.onAuthStateChanged((user) => {
        if (user) {
          // Redirecting to your second page (math.html)
          window.location.href = "math.html";
        }
      });
    </script>
  </body>
</html>
